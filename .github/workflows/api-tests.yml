name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: docker compose --version

      - name: Start services with Docker Compose
        run: |
          docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          
          # Подождать events-service
          for i in {1..30}; do
            if curl -s http://localhost:8082/health; then
              echo "events-service is ready"
              break
            fi
            echo "Waiting for events-service..."
            sleep 5
          done
          
          # Подождать proxy-service
          for i in {1..30}; do
            if curl -s http://localhost:8000/health; then
              echo "proxy-service is ready"
              break
            fi
            echo "Waiting for proxy-service..."
            sleep 5
          done

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json

      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install

      - name: Run API tests in Docker
        working-directory: tests/postman
        run: |
          docker build -t cinemaabyss-api-tests .
          docker run --network=cinemaabyss-network -v "$(pwd)/reports:/app/reports" cinemaabyss-api-tests

      - name: Stop services
        if: always()
        run: docker compose down
